# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng trên mạng xã hội (Twitter) theo chủ đề. Chỉ gọi khi user nhắc rõ Twitter/mạng xã hội/tweet, hoặc yêu cầu cả web lẫn mạng xã hội."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa NGẮN GỌN (1-3 từ, chủ đề cốt lõi), không phải nguyên câu hỏi."}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên web (không phải mạng xã hội). Dùng cho tin tức/chủ đề chung. Nếu user chỉ hỏi tin tức/chủ đề trên web mà không nhắc Twitter/mạng xã hội, chỉ gọi tool này, KHÔNG gọi thêm social_search."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa NGẮN GỌN (1-3 từ, chủ đề cốt lõi), không phải nguyên câu hỏi. Ví dụ: user hỏi 'tin tức AI nổi bật hôm nay' -> query='AI', không phải 'tin tức AI nổi bật hôm nay'."}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  - name: dedupe_sources
    description: "Loại bỏ item trùng lặp từ kết quả đã có trước khi format. Chỉ dùng sau lookup/social_search/fetch; không dùng để tìm kiếm hoặc đọc nguồn mới."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã thu thập từ tool khác"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        max_items: {type: integer, default: 10, description: "Số item tối đa giữ lại"}
      required: [items]

  - name: source_triage
    description: "Chấm điểm ưu tiên và gắn cờ rủi ro cho các item đã thu thập trước khi format. Chỉ dùng sau khi đã có items từ tool khác; không dùng để tìm kiếm, đọc URL hoặc xác minh fact mới."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã thu thập từ tool khác"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              date: {type: string}
              section: {type: string}
        query: {type: string, default: "", description: "Chủ đề research ban đầu để tính mức độ liên quan"}
        max_items: {type: integer, default: 8, description: "Số item ưu tiên tối đa trả về"}
      required: [items]

  - name: citation_audit
    description: "Kiểm tra item đã thu thập có đủ URL/source/title-or-summary để trích dẫn trong report/digest hay chưa. Chỉ dùng sau khi đã có items; không dùng để tìm kiếm, đọc URL hoặc xác minh fact mới."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã thu thập từ tool khác"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
      required: [items]

  - name: brief_builder
    description: "Tạo brief ngắn cho demo/report từ các item đã có. Chỉ dùng sau lookup/social_search/timeline/fetch/policy/papers; không dùng để tìm kiếm hoặc đọc nguồn mới."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item đã thu thập từ tool khác"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        audience: {type: string, default: "demo reviewers", description: "Người đọc brief"}
        objective: {type: string, default: "summarize the most relevant findings", description: "Mục tiêu brief"}
        max_items: {type: integer, default: 5, description: "Số item tối đa đưa vào brief"}
      required: [items]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản đi."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]
